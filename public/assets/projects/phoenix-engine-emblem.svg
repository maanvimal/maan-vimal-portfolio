<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <defs>
    <!-- Phoenix Gold & Ember Gradients with Coding Accent Highlights -->
    <linearGradient id="phxGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="75%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <linearGradient id="phxWingGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="85%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <linearGradient id="phxWingGradRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="85%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <linearGradient id="phxMatrixAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#39FF72" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.2" />
    </linearGradient>

    <filter id="phxGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(200, 200) scale(0.92) translate(-200, -200)">
    <!-- OUTER ORBITAL RETICLE ACCENTS (Subtle Coding Alignment) -->
    <circle
      cx="200"
      cy="200"
      r="175"
      stroke="rgba(245, 158, 11, 0.15)"
      stroke-width="1"
      stroke-dasharray="4 8"
    />
    <circle
      cx="200"
      cy="200"
      r="145"
      stroke="rgba(57, 255, 114, 0.12)"
      stroke-width="1"
      stroke-dasharray="2 12"
    />

    <!-- WINGS: LEFT WING PLUMES -->
    <!-- Primary Outer Left Feather -->
    <path
      d="M 200 240
         C 140 230, 80 180, 75 110
         C 72 85, 85 60, 110 50
         C 115 75, 135 115, 170 145
         C 185 160, 195 190, 200 240 Z"
      fill="url(#phxWingGradLeft)"
    />
    <!-- Mid Secondary Left Feather -->
    <path
      d="M 195 240
         C 150 215, 105 180, 100 135
         C 115 140, 140 160, 175 180
         C 188 190, 192 215, 195 240 Z"
      fill="url(#phxWingGradLeft)"
      opacity="0.9"
    />
    <!-- Lower Inner Left Feather -->
    <path
      d="M 190 240
         C 160 210, 130 185, 125 155
         C 140 160, 165 175, 185 200
         C 188 215, 190 228, 190 240 Z"
      fill="url(#phxWingGradLeft)"
      opacity="0.8"
    />

    <!-- WINGS: RIGHT WING PLUMES -->
    <!-- Primary Outer Right Feather -->
    <path
      d="M 200 240
         C 260 230, 320 180, 325 110
         C 328 85, 315 60, 290 50
         C 285 75, 265 115, 230 145
         C 215 160, 205 190, 200 240 Z"
      fill="url(#phxWingGradRight)"
    />
    <!-- Mid Secondary Right Feather -->
    <path
      d="M 205 240
         C 250 215, 295 180, 300 135
         C 285 140, 260 160, 225 180
         C 212 190, 208 215, 205 240 Z"
      fill="url(#phxWingGradRight)"
      opacity="0.9"
    />
    <!-- Lower Inner Right Feather -->
    <path
      d="M 210 240
         C 240 210, 270 185, 275 155
         C 260 160, 235 175, 215 200
         C 212 215, 210 228, 210 240 Z"
      fill="url(#phxWingGradRight)"
      opacity="0.8"
    />

    <!-- PHOENIX BODY & TORSO -->
    <!-- Central Breast & Body Shield -->
    <path
      d="M 200 130
         C 215 155, 220 195, 200 250
         C 180 195, 185 155, 200 130 Z"
      fill="url(#phxGoldGrad)"
      stroke="rgba(254, 240, 138, 0.6)"
      stroke-width="1.5"
    />

    <!-- Inner Heart Core / Cyber Diamond -->
    <polygon
      points="200,165 210,195 200,225 190,195"
      fill="#050706"
      stroke="#39FF72"
      stroke-width="1.5"
    />
    <circle
      cx="200"
      cy="195"
      r="3"
      fill="#39FF72"
    />

    <!-- PHOENIX HEAD & CREST -->
    <!-- Neck -->
    <path
      d="M 194 135 L 206 135 L 204 105 L 196 105 Z"
      fill="url(#phxGoldGrad)"
    />

    <!-- Head Profile -->
    <path
      d="M 194 105
         C 192 90, 196 75, 200 70
         C 204 75, 208 90, 206 105
         C 212 108, 222 100, 228 102
         C 218 108, 212 115, 200 120
         C 188 115, 182 108, 172 102
         C 178 100, 188 108, 194 105 Z"
      fill="url(#phxGoldGrad)"
    />

    <!-- Crown / Crest Top Spikes -->
    <path
      d="M 200 70 L 200 42 L 205 60 L 214 48 L 210 68 L 222 62 L 212 76 Z"
      fill="url(#phxGoldGrad)"
    />
    <path
      d="M 200 70 L 200 42 L 195 60 L 186 48 L 190 68 L 178 62 L 188 76 Z"
      fill="url(#phxGoldGrad)"
    />

    <!-- Beak -->
    <polygon
      points="200,95 208,102 200,105 192,102"
      fill="#FEF08A"
    />

    <!-- TAIL FEATHERS / FLAME STREAMS -->
    <!-- Central Tail Plumage -->
    <path
      d="M 200 245
         C 208 280, 212 320, 200 365
         C 188 320, 192 280, 200 245 Z"
      fill="url(#phxGoldGrad)"
    />
    <!-- Left Sweeping Tail Feather -->
    <path
      d="M 195 250
         C 180 280, 160 310, 140 330
         C 155 315, 175 285, 190 255 Z"
      fill="url(#phxWingGradLeft)"
    />
    <!-- Right Sweeping Tail Feather -->
    <path
      d="M 205 250
         C 220 280, 240 310, 260 330
         C 245 315, 225 285, 210 255 Z"
      fill="url(#phxWingGradRight)"
    />
  </g>
</svg>
