<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradients & Filters for Coding aesthetic -->
    <linearGradient id="csBlueFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="csNavyFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="csTopFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="csBlueArrow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="csGreenArrow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="csCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="csGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(0, 0)">
    <!-- 1. LEFT CYCLICAL BLUE ARROW -->
    <path
      d="M 120 280
         C 75 255, 60 195, 75 145
         C 82 120, 100 95, 125 80"
      stroke="url(#csBlueArrow)"
      stroke-width="18"
      stroke-linecap="round"
    />
    <!-- Left Arrow Head -->
    <polygon
      points="105,75 140,78 126,110"
      fill="#38BDF8"
    />

    <!-- 2. RIGHT CYCLICAL GREEN ARROW -->
    <path
      d="M 280 120
         C 325 145, 340 205, 325 255
         C 318 280, 300 305, 275 320"
      stroke="url(#csGreenArrow)"
      stroke-width="18"
      stroke-linecap="round"
    />
    <!-- Right Arrow Head -->
    <polygon
      points="295,325 260,322 274,290"
      fill="#10B981"
    />

    <!-- 3. CENTRAL ISOMETRIC BOOK / CUBE -->
    <!-- Top Face (Book Pages / Opening) -->
    <polygon
      points="200,165 265,195 200,225 135,195"
      fill="url(#csTopFace)"
      stroke="#CBD5E1"
      stroke-width="1.5"
    />

    <!-- Left Front Face (Royal Blue) -->
    <polygon
      points="135,195 200,225 200,295 135,265"
      fill="url(#csBlueFace)"
      stroke="rgba(56, 189, 248, 0.4)"
      stroke-width="1.5"
    />

    <!-- Right Side Face (Dark Navy) -->
    <polygon
      points="200,225 265,195 265,265 200,295"
      fill="url(#csNavyFace)"
      stroke="rgba(51, 65, 85, 0.6)"
      stroke-width="1.5"
    />

    <!-- Cube Spine Line -->
    <line
      x1="200" y1="225" x2="200" y2="295"
      stroke="rgba(255, 255, 255, 0.25)"
      stroke-width="2"
    />

    <!-- 4. GRADUATION CAP (MORTARBOARD) -->
    <!-- Skull Cap Base Underneath -->
    <polygon
      points="175,152 225,152 230,172 170,172"
      fill="#0F172A"
      stroke="#475569"
      stroke-width="1.5"
    />

    <!-- Main Diamond Cap Top -->
    <polygon
      points="200,105 275,138 200,168 125,138"
      fill="url(#csCap)"
      stroke="#64748B"
      stroke-width="2"
    />

    <!-- Cap Diamond Bevel Highlight -->
    <polyline
      points="125,138 200,105 275,138"
      stroke="rgba(255, 255, 255, 0.4)"
      stroke-width="1.5"
      fill="none"
    />

    <!-- Cap Button -->
    <circle
      cx="200"
      cy="136"
      r="4.5"
      fill="#0F172A"
      stroke="#94A3B8"
      stroke-width="1.5"
    />

    <!-- Hanging Tassel String to Right -->
    <path
      d="M 200 136 Q 238 140 248 165"
      stroke="#0F172A"
      stroke-width="2.5"
      fill="none"
    />
    <path
      d="M 200 136 Q 238 140 248 165"
      stroke="#94A3B8"
      stroke-width="1"
      fill="none"
    />

    <!-- Tassel Ring / Knot -->
    <circle
      cx="248"
      cy="166"
      r="3"
      fill="#38BDF8"
    />

    <!-- Hanging Tassel Plume -->
    <polygon
      points="246,168 250,168 252,185 244,185"
      fill="#0F172A"
      stroke="#64748B"
      stroke-width="1"
    />
  </g>
</svg>
